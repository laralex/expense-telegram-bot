[project]
name = "expense-telegram-bot"
version = "0.1.0"
description = "A personal Telegram bot for logging expenses and income by month."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
